services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pentor-web
    restart: unless-stopped
    networks:
      - pentor
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pentor-api
    restart: unless-stopped
    environment:
      PORT: "3000"
      CORS_ORIGINS: ""
      SCAN_ALLOWLIST: "liqheat.com,www.liqheat.com,koinvizyon.com,www.koinvizyon.com,hamsi.ai,www.hamsi.ai,contentdetect.ai,www.contentdetect.ai,textara.ai,www.textara.ai,lab.95-179-169-114.sslip.io"
      SCAN_CACHE_DIR: "/app/data/scan-cache"
      SCAN_CACHE_TTL_MS: "86400000"
      SCANNER_URL: "http://scanner:3100"
      SCANNER_TOKEN: "${SCANNER_TOKEN:-change-me-before-public-launch}"
    volumes:
      - nuclei_templates:/home/node/nuclei-templates
      - scan_cache:/app/data
    networks:
      - pentor
    depends_on:
      - scanner
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scanner:
    build:
      context: ./server
      dockerfile: Scanner.Dockerfile
    container_name: pentor-scanner
    restart: unless-stopped
    environment:
      PORT: "3100"
      SCAN_ALLOWLIST: "liqheat.com,www.liqheat.com,koinvizyon.com,www.koinvizyon.com,hamsi.ai,www.hamsi.ai,contentdetect.ai,www.contentdetect.ai,textara.ai,www.textara.ai,lab.95-179-169-114.sslip.io"
      SCANNER_TOKEN: "${SCANNER_TOKEN:-change-me-before-public-launch}"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    mem_limit: 512m
    cpus: 0.75
    networks:
      - pentor
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  lab:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: pentor-lab
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./lab:/usr/share/nginx/html:ro
      - ./lab/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - pentor
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  gateway:
    image: caddy:2.10-alpine
    container_name: pentor-gateway
    restart: unless-stopped
    depends_on:
      - web
      - api
      - lab
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - pentor
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  pentor:
    name: pentor

volumes:
  caddy_data:
  caddy_config:
  nuclei_templates:
  scan_cache:
